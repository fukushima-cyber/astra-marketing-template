name: Verify template
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-test-password
          POSTGRES_DB: astra_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_POSTGRES_URL: postgresql://postgres:isolated-test-password@127.0.0.1:5432/astra_migration_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:template
      - name: Prepare isolated PostgreSQL schema
        run: |
          psql "$TEST_POSTGRES_URL" -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon; CREATE ROLE authenticated;'
          for migration in supabase/migrations/*.sql; do
            psql "$TEST_POSTGRES_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npx wrangler deploy --dry-run
